name: Deploy BARstvbot

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"

          npm install --global vercel@latest

          OUTPUT=$(vercel deploy --prod --yes \
            --token "$VERCEL_TOKEN" \
            --name barstvbot 2>&1 | tee /tmp/vercel.log)

          URL=$(printf '%s\n' "$OUTPUT" \
            | grep -Eo 'https://[A-Za-z0-9._-]+\.vercel\.app' \
            | tail -1)

          if [ -z "$URL" ]; then
            echo "Could not detect Vercel deployment URL"
            cat /tmp/vercel.log
            exit 1
          fi

          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed: $URL"

      - name: Configure Telegram webhook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN"

          curl --fail-with-body -sS \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            -d "url=${DEPLOY_URL}/api/telegram"

      - name: Verify webhook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail

          curl --fail-with-body -sS \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getWebhookInfo"
